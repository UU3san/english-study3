<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語スマホ問題集</title>
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--text:#17212b;--muted:#66727d;--line:#d9e1e8;
  --accent:#2563eb;--ok:#15803d;--ng:#b91c1c;--warn:#9a3412;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button,input,select{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px 11px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.warn{background:#fff7ed;border-color:#fdba74;color:var(--warn)}
button:disabled{opacity:.42;cursor:not-allowed}
.app{max-width:900px;margin:0 auto;padding:10px 12px 90px}
.topbar{background:var(--bg);padding-bottom:8px}
.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.controls{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,auto);gap:7px;margin-top:8px}
details{margin-top:7px}
summary{cursor:pointer;list-style:none;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-weight:700}
summary::-webkit-details-marker{display:none}
.settings{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:6px}
.userrow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) auto auto auto;gap:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.stat{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:#fafbfc}
.stat .lab{font-size:11px;color:var(--muted)}
.stat .val{font-size:16px;font-weight:800;margin-top:2px}
.progress{height:7px;border-radius:999px;overflow:hidden;background:#dde5ed;margin-top:8px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.quizmeta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{display:inline-block;font-size:12px;font-weight:700;background:#eef4ff;color:#1d4ed8;border-radius:999px;padding:4px 8px}
.qsub{font-size:13px;color:var(--muted);margin-top:5px}
.question{font-size:19px;line-height:1.7;white-space:pre-line;margin-top:13px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.choice{text-align:left;min-height:54px;line-height:1.5;padding:11px 13px}
.choice.correct{background:#f0fdf4;border-color:#86efac}
.choice.wrong{background:#fef2f2;border-color:#fca5a5}
.feedback{display:none;margin-top:13px;border:1px solid var(--line);border-radius:12px;padding:12px}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border-color:#86efac}
.feedback.ng{background:#fef2f2;border-color:#fca5a5}
.fbtitle{font-size:17px;font-weight:800}
.fbbody{font-size:14px;line-height:1.7;white-space:pre-line;margin-top:5px}
.result{display:none}
.result.show{display:block}
.result h2{margin:10px 0 4px}
.resultbuttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.help{font-size:12px;line-height:1.6;color:var(--muted);margin-top:8px}
.bottomnav{display:none;position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottomnav.active{display:block}
.navinner{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:7px}
.hidden{display:none!important}
@media(max-width:700px){
  .app{padding-top:8px}
  .titleline{align-items:flex-start}
  h1{font-size:17px}
  .controls{grid-template-columns:1fr 1fr}
  .controls select{grid-column:1/-1;width:100%}
  .userrow{grid-template-columns:1fr 1fr}
  .userrow input,.userrow select{width:100%;min-width:0}
  .stats{grid-template-columns:1fr 1fr}
  .choices{grid-template-columns:1fr}
  .question{font-size:18px}
  .card{padding:13px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="titleline">
      <h1>英語問題集　第1回〜第8回</h1>
      <div class="chips">
        <span class="chip">ユーザー：<strong id="miniUser">学習者1</strong></span>
        <span class="chip">間違い：<strong id="miniWrong">0</strong>問</span>
      </div>
    </div>

    <div class="controls">
      <select id="lessonSelect" aria-label="出題範囲">
        <option value="all">全80問（1〜8回）</option>
        <option value="1">第1回 短文①</option>
        <option value="2">第2回 短文②</option>
        <option value="3">第3回 短文③</option>
        <option value="4">第4回 短文④</option>
        <option value="5">第5回 会話①</option>
        <option value="6">第6回 会話②</option>
        <option value="7">第7回 会話③</option>
        <option value="8">第8回 会話④</option>
      </select>
      <button id="startBtn" class="primary">最初から</button>
      <button id="randomBtn">ランダム10問</button>
      <button id="wrongBtn" class="warn">間違いだけ</button>
      <button id="jumpBtn">問題へ</button>
    </div>

    <details id="settingsPanel">
      <summary>⚙ ユーザー・成績</summary>
      <div class="settings">
        <div class="userrow">
          <input id="newUserName" type="text" placeholder="新しいユーザー名">
          <select id="userSelect" aria-label="ユーザー選択"></select>
          <button id="addUserBtn" class="primary">登録</button>
          <button id="switchUserBtn">切替</button>
          <button id="deleteUserBtn" class="warn">削除</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="lab">対象</div><div class="val" id="targetCount">80問</div></div>
          <div class="stat"><div class="lab">累計正解</div><div class="val" id="savedCorrect">0</div></div>
          <div class="stat"><div class="lab">学習回数</div><div class="val" id="savedSessions">0</div></div>
          <div class="stat"><div class="lab">間違い登録</div><div class="val" id="savedWrongBank">0</div></div>
        </div>
        <div class="help">ユーザーごとの記録は、この端末のブラウザ内に保存されます。PCとスマホの記録は別です。</div>
      </div>
    </details>

    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <section id="quizCard" class="card">
    <div class="quizmeta">
      <div>
        <span id="modeBadge" class="badge">通常問題</span>
        <div id="qSub" class="qsub"></div>
      </div>
      <div id="countText" class="qsub"></div>
    </div>
    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback">
      <div id="fbTitle" class="fbtitle"></div>
      <div id="fbBody" class="fbbody"></div>
    </div>
  </section>

  <section id="resultCard" class="card result">
    <span class="badge">学習結果</span>
    <h2 id="resultScore"></h2>
    <div id="resultMessage" class="help"></div>
    <div class="resultbuttons">
      <button id="retrySessionBtn" class="primary">今回の間違いを再テスト</button>
      <button id="retryBankBtn" class="warn">登録中の間違いだけ</button>
      <button id="againBtn">もう一度</button>
    </div>
    <div id="wrongList" class="help"></div>
  </section>

  <div class="help">選択肢を押すと○×と解説が表示され、その後「次へ」が押せます。間違えた問題は自動登録され、再テストで正解すると登録から外れます。</div>
</div>

<div id="bottomNav" class="bottomnav active">
  <div class="navinner">
    <button id="prevBtn">← 前へ</button>
    <button id="nextBtn" class="primary" disabled>次へ</button>
    <button id="shuffleBtn">ランダム</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"q": "Jim had a cold yesterday, but he (     ) fine today.", "c": ["breaks", "pulls", "feels", "means"], "a": 2, "e": "feel fine で「元気だ・具合がよい」。主語が he なので feels。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 1, "qid": "L01Q01"}, {"q": "A: Jenny, walk (     ) in the museum.\nB: Sorry, Ms. Brown. I’ll be careful.", "c": ["equally", "quietly", "clearly", "brightly"], "a": 1, "e": "博物館では「静かに」歩くので quietly。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 2, "qid": "L01Q02"}, {"q": "A: The new movie was really good.\nB: I didn’t think so. I don’t like the main actor, so I thought it was (     ).", "c": ["boring", "exciting", "glad", "fun"], "a": 0, "e": "I didn’t think so に続くので「退屈な」boring が合う。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 3, "qid": "L01Q03"}, {"q": "Susan likes to learn about other (     ). She travels to many countries during her vacations.", "c": ["accidents", "cultures", "prizes", "difficulties"], "a": 1, "e": "多くの国へ行くので learn about other cultures（他の文化を学ぶ）。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 4, "qid": "L01Q04"}, {"q": "A: Excuse me. May I (     ) your dictionary?\nB: Sure. Here you are.", "c": ["borrow", "mail", "lend", "write"], "a": 0, "e": "May I borrow ...? で「〜を借りてもいいですか」。lend は「貸す」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 5, "qid": "L01Q05"}, {"q": "Sarah couldn’t find her phone. She looked everywhere. (     ) last, she found it under her bed.", "c": ["At", "On", "In", "Of"], "a": 0, "e": "at last で「ついに・とうとう」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 6, "qid": "L01Q06"}, {"q": "Lucy and Fred talked (     ) the phone for about an hour last night.", "c": ["for", "out", "in", "on"], "a": 3, "e": "on the phone で「電話で」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 7, "qid": "L01Q07"}, {"q": "A: This sweater is too big. Can I (     ) on a smaller one?\nB: Sure. Here you are.", "c": ["make", "try", "serve", "push"], "a": 1, "e": "try on で「試着する」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 8, "qid": "L01Q08"}, {"q": "The sky is (     ) with clouds this morning, but it will be sunny in the afternoon.", "c": ["cover", "covered", "covers", "covering"], "a": 1, "e": "be covered with ... で「〜でおおわれている」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 9, "qid": "L01Q09"}, {"q": "A: Do you have a friend (     ) brother is a soccer player?\nB: No, I don’t.", "c": ["which", "whose", "whom", "who"], "a": 1, "e": "whose brother で「その兄弟が〜である友達」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 10, "qid": "L01Q10"}, {"q": "Susan walks in the park for an hour every morning for her (     ).", "c": ["package", "machine", "way", "health"], "a": 3, "e": "for her health で「健康のために」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 1, "qid": "L02Q01"}, {"q": "Ted watched TV (     ) his mother told him to go to bed.", "c": ["if", "during", "since", "until"], "a": 3, "e": "until で「〜するまで」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 2, "qid": "L02Q02"}, {"q": "A: I (     ) a cup of coffee for you, Jack.\nB: Thank you. That was kind of you.", "c": ["graduated", "worked", "ordered", "shared"], "a": 2, "e": "a cup of coffee を目的語に取れるのは ordered（注文した）。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 3, "qid": "L02Q03"}, {"q": "I will (     ) my friends to my birthday party next week.", "c": ["grow", "show", "move", "invite"], "a": 3, "e": "invite A to B で「AをBに招待する」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 4, "qid": "L02Q04"}, {"q": "There is (     ) time to eat lunch before the movie.", "c": ["able", "sure", "whole", "enough"], "a": 3, "e": "enough time で「十分な時間」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 5, "qid": "L02Q05"}, {"q": "A: Do you walk to school, Robert?\nB: No, Tim. It’s too (     ) from my house. I go by bike.", "c": ["heavy", "far", "high", "wrong"], "a": 1, "e": "It’s too far from my house. で「家から遠すぎる」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 6, "qid": "L02Q06"}, {"q": "A: Did you have a (     ) to go to the new Italian restaurant?\nB: No. I was busy.", "c": ["chance", "secret", "course", "support"], "a": 0, "e": "have a chance to ... で「〜する機会がある」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 7, "qid": "L02Q07"}, {"q": "A: You haven’t eaten anything this morning. Do you want to eat something?\nB: Thank you. I’d like to have a (     ) of bread.", "c": ["bowl", "pair", "slice", "sheet"], "a": 2, "e": "a slice of bread で「パン1枚」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 8, "qid": "L02Q08"}, {"q": "A: Let’s play tennis this afternoon, Jane.\nB: Sorry, Dan. I have a lot of things (     ) today.", "c": ["do", "done", "to do", "doing"], "a": 2, "e": "things to do で「やるべきこと」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 9, "qid": "L02Q09"}, {"q": "Mark got up (     ) than his mother this morning because he had to do his homework.", "c": ["early", "earlier", "earliest", "soon"], "a": 1, "e": "than があるので比較級 earlier。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 10, "qid": "L02Q10"}, {"q": "A: Hello. This is Bobby. May I speak to Lucy, please?\nB: I’m afraid you have the (     ) number.", "c": ["poor", "dark", "bad", "wrong"], "a": 3, "e": "wrong number で「番号が違います」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 1, "qid": "L03Q01"}, {"q": "A: Keiko, there are a lot of people in the room. I can’t sing in front of so many people.\nB: Don’t be so (     ), Tim. I know you can do it.", "c": ["busy", "lucky", "shy", "honest"], "a": 2, "e": "人前で歌えない→「恥ずかしがらないで」なので shy。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 2, "qid": "L03Q02"}, {"q": "I go to Nikko with my grandparents and (     ) a week every year.", "c": ["believe", "spend", "trust", "push"], "a": 1, "e": "spend a week で「1週間過ごす」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 3, "qid": "L03Q03"}, {"q": "Every year, Helen visits Canada (     ) her winter vacation.", "c": ["when", "while", "during", "between"], "a": 2, "e": "during her winter vacation で「冬休みの間に」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 4, "qid": "L03Q04"}, {"q": "Jonathan has club (     ) every Saturday afternoon.", "c": ["activities", "hobbies", "companies", "subjects"], "a": 0, "e": "club activities で「部活動」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 5, "qid": "L03Q05"}, {"q": "A: Please (     ) off the TV. The baby is sleeping.\nB: Oh, I’m sorry. I didn’t know.", "c": ["take", "go", "put", "turn off"], "a": 3, "e": "turn off the TV で「テレビを消す」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 6, "qid": "L03Q06"}, {"q": "A: Please take a seat and make (     ) at home.\nB: Thank you.", "c": ["you", "your", "yours", "yourself"], "a": 3, "e": "make yourself at home で「どうぞくつろいで」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 7, "qid": "L03Q07"}, {"q": "I met Jimmy on the (     ) to school this morning. We talked about next month’s school trip.", "c": ["way", "minute", "pair", "goal"], "a": 0, "e": "on the way to school で「学校へ行く途中で」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 8, "qid": "L03Q08"}, {"q": "A: Who is the woman (     ) by the car?\nB: That woman with long hair? She’s our new music teacher, Ms. Young.", "c": ["stand", "to stand", "stood", "standing"], "a": 3, "e": "the woman standing by the car で「車のそばに立っている女性」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 9, "qid": "L03Q09"}, {"q": "A: Do you have two cameras?\nB: Yes. This new camera is (     ) bigger than the other.", "c": ["many", "well", "very", "much"], "a": 3, "e": "much bigger で「ずっと大きい」。比較級を強める much。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 10, "qid": "L03Q10"}, {"q": "A: Are you looking for (     ) special?\nB: Yes, a computer. I want something light and small.", "c": ["either", "anything", "little", "one"], "a": 1, "e": "疑問文では anything special（何か特別なもの）が自然。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 1, "qid": "L04Q01"}, {"q": "The baseball player (     ) to go to the U.S. to play in the major leagues.", "c": ["received", "climbed", "collected", "decided"], "a": 3, "e": "decide to ... で「〜することに決める」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 2, "qid": "L04Q02"}, {"q": "Many people carry their smartphones everywhere because they are very (     ).", "c": ["useful", "careful", "foreign", "proud"], "a": 0, "e": "スマホは「便利な」ので useful。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 3, "qid": "L04Q03"}, {"q": "A: Excuse me, can you tell me the way to the city library?\nB: Sorry. I’m a (     ) around here.", "c": ["mayor", "stranger", "singer", "librarian"], "a": 1, "e": "I’m a stranger around here. で「この辺に詳しくないんです」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 4, "qid": "L04Q04"}, {"q": "A: Why are you late, Ken?\nB: My alarm clock didn’t (     ) this morning.", "c": ["become", "pass", "bring", "work"], "a": 3, "e": "alarm clock didn’t work で「目覚ましが鳴らなかった／作動しなかった」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 5, "qid": "L04Q05"}, {"q": "A: Where do you get (     ) the bus?\nB: At the next bus stop.", "c": ["off", "down", "under", "over"], "a": 0, "e": "get off the bus で「バスを降りる」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 6, "qid": "L04Q06"}, {"q": "A: (     ) off your T-shirt, Tom. It’s so dirty.\nB: Yes, Mom. I’ll put it in the washing machine.", "c": ["Take", "Carry", "Build", "Lend"], "a": 0, "e": "take off で「脱ぐ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 7, "qid": "L04Q07"}, {"q": "The town is famous (     ) its beautiful mountains.", "c": ["to", "in", "at", "for"], "a": 3, "e": "be famous for ... で「〜で有名だ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 8, "qid": "L04Q08"}, {"q": "Henry hasn’t (     ) his homework yet, so he can’t play with his brother.", "c": ["finish", "finishing", "finishes", "finished"], "a": 3, "e": "hasn’t finished ... yet で現在完了の形。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 9, "qid": "L04Q09"}, {"q": "I love traveling abroad. It makes (     ) happy.", "c": ["my", "our", "we", "me"], "a": 3, "e": "make me happy で「私を幸せにする」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 10, "qid": "L04Q10"}, {"q": "Boy: const APP_KEY = 'english-smart-quiz-users-v2';
const OLD_USER_KEY = 'english-smart-quiz-users-v1';

let store = loadStore();
let currentSet = [];
let currentIndex = 0;
let answered = false;
let sessionCorrect = 0;
let sessionWrong = [];
let currentMode = 'normal';
let lastBaseMode = 'normal';

const $ = id => document.getElementById(id);

function blankProfile(){
  return {correct:0,sessions:0,history:[],wrongBank:[],solved:{}};
}
function loadStore(){
  let obj = null;
  try {
    obj = JSON.parse(localStorage.getItem(APP_KEY) || 'null');
    if (!obj) obj = JSON.parse(localStorage.getItem(OLD_USER_KEY) || 'null');
  } catch(e) {}
  if (!obj || typeof obj !== 'object') {
    obj = {users:['学習者1'],currentUser:'学習者1',profiles:{'学習者1':blankProfile()}};
  }
  if (!Array.isArray(obj.users)) obj.users = [];
  if (!obj.profiles || typeof obj.profiles !== 'object') obj.profiles = {};
  if (!obj.currentUser && obj.users.length) obj.currentUser = obj.users[0];
  if (!obj.currentUser) {
    obj.currentUser = '学習者1';
    if (!obj.users.includes('学習者1')) obj.users.push('学習者1');
  }
  ensureProfileOn(obj, obj.currentUser);
  try { localStorage.setItem(APP_KEY, JSON.stringify(obj)); } catch(e) {}
  return obj;
}
function ensureProfileOn(s,name){
  if (!s.profiles[name]) s.profiles[name] = blankProfile();
  const p = s.profiles[name];
  if (!Array.isArray(p.wrongBank)) p.wrongBank=[];
  if (!Array.isArray(p.history)) p.history=[];
  if (!p.solved || typeof p.solved !== 'object') p.solved={};
  p.correct = Number(p.correct)||0;
  p.sessions = Number(p.sessions)||0;
  return p;
}
function saveStore(){ try{localStorage.setItem(APP_KEY,JSON.stringify(store));}catch(e){} }
function profile(){ return ensureProfileOn(store,store.currentUser); }

function refreshUserUI(){
  const sel=$('userSelect');
  sel.innerHTML='';
  store.users.forEach(name=>{
    const o=document.createElement('option');
    o.value=name;o.textContent=name;
    if(name===store.currentUser)o.selected=true;
    sel.appendChild(o);
  });
  $('miniUser').textContent=store.currentUser;
  updateStats();
}
function updateStats(){
  const p=profile();
  $('savedCorrect').textContent=p.correct;
  $('savedSessions').textContent=p.sessions;
  $('savedWrongBank').textContent=p.wrongBank.length;
  $('miniWrong').textContent=p.wrongBank.length;
  $('targetCount').textContent=scopeQuestions(false).length+'問';
}
function scopeQuestions(wrongOnly){
  const v=$('lessonSelect').value;
  let set=ALL_QUESTIONS.filter(q=>v==='all'||String(q.lesson)===v);
  if(wrongOnly){
    const ids=new Set(profile().wrongBank);
    set=set.filter(q=>ids.has(q.qid));
  }
  return set;
}
function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function start(mode,scrollToQuestion){
  let set;
  currentMode=mode;
  if(mode==='wrong'){
    set=scopeQuestions(true);
    if(!set.length){alert('登録されている間違い問題がありません。');return;}
  }else{
    set=scopeQuestions(false);
    if(mode==='random')set=shuffle(set).slice(0,Math.min(10,set.length));
  }
  currentSet=set;
  currentIndex=0;
  answered=false;
  sessionCorrect=0;
  sessionWrong=[];
  lastBaseMode=mode;
  $('resultCard').classList.remove('show');
  $('quizCard').classList.remove('hidden');
  $('bottomNav').classList.add('active');
  render();
  if(scrollToQuestion){
    setTimeout(()=>$('quizCard').scrollIntoView({behavior:'smooth',block:'start'}),40);
  }
}
function render(){
  const item=currentSet[currentIndex];
  if(!item)return;
  $('modeBadge').textContent=currentMode==='wrong'?'間違いだけ':currentMode==='random'?'ランダム10問':currentMode==='retry'?'今回の間違い再テスト':'通常問題';
  $('qSub').textContent=`第${item.lesson}回 ${item.lessonTitle} / 問${item.no}`;
  $('countText').textContent=`${currentIndex+1} / ${currentSet.length}`;
  $('question').textContent=item.q;
  $('progressBar').style.width=((currentIndex)/currentSet.length*100)+'%';
  const box=$('choices');box.innerHTML='';
  item.c.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='choice';
    b.innerHTML=`<strong>${i+1}.</strong> ${c}`;
    b.addEventListener('click',()=>answer(i));
    box.appendChild(b);
  });
  answered=false;
  $('feedback').className='feedback';
  $('fbTitle').textContent='';
  $('fbBody').textContent='';
  updateNav();
}
function answer(idx){
  if(answered)return;
  answered=true;
  const item=currentSet[currentIndex];
  const p=profile();
  if(!p.solved[item.qid])p.solved[item.qid]={correct:0,wrong:0};
  const ok=idx===item.a;
  [...$('choices').children].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.a)b.classList.add('correct');
    if(i===idx&&!ok)b.classList.add('wrong');
  });
  if(ok){
    sessionCorrect++;
    p.correct++;
    p.solved[item.qid].correct++;
    p.wrongBank=p.wrongBank.filter(id=>id!==item.qid);
    $('feedback').classList.add('show','ok');
    $('fbTitle').textContent='○ 正解！';
  }else{
    p.solved[item.qid].wrong++;
    if(!p.wrongBank.includes(item.qid))p.wrongBank.push(item.qid);
    if(!sessionWrong.some(q=>q.qid===item.qid))sessionWrong.push(item);
    $('feedback').classList.add('show','ng');
    $('fbTitle').textContent='× ちがいます';
  }
  $('fbBody').textContent=`正解：${item.a+1}. ${item.c[item.a]}\n解説：${item.e}`;
  saveStore();updateStats();updateNav();
}
function updateNav(){
  $('prevBtn').disabled=currentIndex===0;
  $('nextBtn').disabled=!answered;
  $('nextBtn').textContent=currentIndex===currentSet.length-1?'結果へ':'次へ';
}
function next(){
  if(!answered)return;
  if(currentIndex<currentSet.length-1){currentIndex++;render();window.scrollTo({top:$('quizCard').offsetTop-8,behavior:'smooth'});}
  else finish();
}
function prev(){
  if(currentIndex===0)return;
  currentIndex--;render();
}
function finish(){
  const p=profile();
  p.sessions++;
  p.history.push({date:new Date().toISOString(),mode:currentMode,total:currentSet.length,correct:sessionCorrect,wrong:currentSet.length-sessionCorrect});
  saveStore();updateStats();
  $('quizCard').classList.add('hidden');
  $('resultCard').classList.add('show');
  $('bottomNav').classList.remove('active');
  const rate=Math.round(sessionCorrect/currentSet.length*100);
  $('resultScore').textContent=`${sessionCorrect} / ${currentSet.length} 問 正解`;
  $('resultMessage').innerHTML=`正答率 <strong>${rate}%</strong>。登録中の間違い問題は <strong>${p.wrongBank.length}問</strong>です。`;
  $('wrongList').textContent=sessionWrong.length?`今回間違えた問題：${sessionWrong.map(q=>`第${q.lesson}回 問${q.no}`).join('、')}`:'今回の間違いはありません。';
  $('retrySessionBtn').disabled=sessionWrong.length===0;
  $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
}
function retrySession(){
  if(!sessionWrong.length)return;
  currentSet=[...sessionWrong];
  currentIndex=0;answered=false;sessionCorrect=0;sessionWrong=[];
  currentMode='retry';
  $('resultCard').classList.remove('show');
  $('quizCard').classList.remove('hidden');
  $('bottomNav').classList.add('active');
  render();
}
function addUser(){
  const name=$('newUserName').value.trim();
  if(!name){alert('ユーザー名を入力してください。');return;}
  if(!store.users.includes(name))store.users.push(name);
  store.currentUser=name;ensureProfileOn(store,name);saveStore();
  $('newUserName').value='';refreshUserUI();$('settingsPanel').open=false;start('normal',true);
}
function switchUser(){
  const name=$('userSelect').value;
  if(!name)return;
  store.currentUser=name;saveStore();refreshUserUI();$('settingsPanel').open=false;start('normal',true);
}
function deleteUser(){
  const name=store.currentUser;
  if(store.users.length<=1){alert('ユーザーは最低1人必要です。');return;}
  if(!confirm(`「${name}」を削除しますか？`))return;
  store.users=store.users.filter(x=>x!==name);
  delete store.profiles[name];
  store.currentUser=store.users[0];
  saveStore();refreshUserUI();start('normal',false);
}

$('startBtn').addEventListener('click',()=>start('normal',true));
$('randomBtn').addEventListener('click',()=>start('random',true));
$('wrongBtn').addEventListener('click',()=>start('wrong',true));
$('jumpBtn').addEventListener('click',()=>$('quizCard').scrollIntoView({behavior:'smooth',block:'start'}));
$('lessonSelect').addEventListener('change',()=>{updateStats();start('normal',false);});
$('addUserBtn').addEventListener('click',addUser);
$('switchUserBtn').addEventListener('click',switchUser);
$('deleteUserBtn').addEventListener('click',deleteUser);
$('newUserName').addEventListener('keydown',e=>{if(e.key==='Enter')addUser();});
$('prevBtn').addEventListener('click',prev);
$('nextBtn').addEventListener('click',next);
$('shuffleBtn').addEventListener('click',()=>start('random',true));
$('retrySessionBtn').addEventListener('click',retrySession);
$('retryBankBtn').addEventListener('click',()=>start('wrong',true));
$('againBtn').addEventListener('click',()=>start(lastBaseMode==='random'?'random':'normal',true));

refreshUserUI();
start('normal',false);
</script>
</body>
</html>
