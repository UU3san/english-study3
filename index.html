<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語スマホ問題集 第1回〜第8回</title>
<style>
:root {
  --bg:#f6f7f8; --card:#ffffff; --text:#17212b; --muted:#5f6b76; --line:#d9e0e6;
  --accent:#2563eb; --accent2:#1d4ed8; --ok:#15803d; --ng:#b91c1c; --soft:#eef4ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,select,input{font:inherit}
a{color:var(--accent2)}
.app{max-width:860px;margin:0 auto;padding:12px 12px 90px}
.header{position:sticky;top:0;z-index:10;background:rgba(246,247,248,.97);backdrop-filter:blur(6px);padding-bottom:10px}
h1{font-size:20px;margin:0;padding-top:4px}
.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,button,input{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.secondary{background:#fff}
button.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
input{min-width:170px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .label{font-size:12px;color:var(--muted)}
.stat .value{font-size:18px;font-weight:700;margin-top:4px}
.progress{height:8px;border-radius:999px;overflow:hidden;background:#dfe7ee;margin-top:10px}
.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent2);font-weight:700}
.qhead{font-size:14px;color:var(--muted);margin-top:4px}
.question{font-size:19px;line-height:1.7;white-space:pre-line;margin-top:10px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:52px;line-height:1.55}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:#86efac;background:#f0fdf4}
.choice.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line)}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border-color:#86efac}
.feedback.ng{background:#fef2f2;border-color:#fca5a5}
.feedback .title{font-weight:800;font-size:18px}
.feedback .body{font-size:14px;line-height:1.75;margin-top:6px;white-space:pre-line}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.navinner{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.result{display:none}
.result.show{display:block}
.list{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.8}
.notice{font-size:13px;color:var(--muted);line-height:1.7;margin-top:12px}
.inline-link{font-size:14px;margin-top:10px}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none !important}
.userbox{display:grid;grid-template-columns:1.1fr 1fr auto auto auto;gap:8px;align-items:center}
.usercurrent{font-size:13px;color:var(--muted);margin-top:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;background:#fafafa;color:var(--muted);line-height:1.7}
details.settings{margin-top:10px}
details.settings > summary{
  list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center;
  justify-content:space-between; gap:8px; border:1px solid var(--line); border-radius:12px;
  background:#fff; padding:9px 12px; font-weight:700;
}
details.settings > summary::-webkit-details-marker{display:none}
.compact-userbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.compact-chip{font-size:12px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:5px 9px}
.mobile-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mobile-actions button,.mobile-actions select{min-height:40px;padding:6px 10px}
@media (max-width:700px){
  .header{position:static;backdrop-filter:none;padding-bottom:4px}
  h1{font-size:18px}
  .sub{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .stat{padding:7px 8px}
  .stat .label{font-size:11px}
  .stat .value{font-size:15px}
  .userbox{grid-template-columns:1fr 1fr}
  .userbox input,.userbox select{width:100%;min-width:0}
  .question{font-size:18px}
  .card{margin-top:8px;padding:13px}
}
@media (max-width:420px) {
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{gap:6px}
  select,button,input{min-height:42px}
  .mobile-actions{display:grid;grid-template-columns:1fr 1fr}
  .mobile-actions select{grid-column:1/-1;width:100%}
  .navinner{grid-template-columns:.8fr 1.4fr .8fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>英語スマホ問題集　第1回〜第8回</h1>
    <div class="sub">タップで解答 → ○× → 解説 → 間違いだけ復習</div>

    <div class="compact-userbar">
      <span class="compact-chip">ユーザー：<strong id="miniUser">未選択</strong></span>
      <span class="compact-chip">間違い：<strong id="miniWrong">0</strong>問</span>
    </div>

    <details id="settingsPanel" class="settings">
      <summary><span>⚙ 設定・成績</span><span class="small">開く</span></summary>
      <section class="card" style="margin-top:8px">
        <div class="badge">ユーザー管理</div>
        <div class="row userbox">
          <input id="newUserName" type="text" placeholder="ユーザー名">
          <select id="userSelect"><option value="">登録済みユーザー</option></select>
          <button id="addUserBtn" class="primary">登録</button>
          <button id="switchUserBtn" class="secondary">切替</button>
          <button id="deleteUserBtn" class="warn">削除</button>
        </div>
        <div id="currentUserText" class="usercurrent">現在のユーザー：未選択</div>
        <div id="compatText" class="usercurrent">スマホ互換モード：準備完了</div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>
    
  </div>

  <section id="quizCard" class="card hidden">
    <div class="meta">
      <div>
        <div id="lessonBadge" class="badge"></div>
        <div id="qhead" class="qhead"></div>
      </div>
      <div id="countText" class="small"></div>
    </div>

    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback">
      <div id="fbTitle" class="title"></div>
      <div id="fbBody" class="body"></div>
    </div>
  </section>

  <section id="resultCard" class="card result">
    <div class="badge">学習結果</div>
    <h2 id="resultScore" style="margin:12px 0 0;font-size:28px"></h2>
    <div id="resultMessage" class="notice"></div>
    <div class="row">
      <button id="retryWrong" class="primary">今回の間違いだけ再テスト</button>
      <button id="restartSame" class="secondary">同じ範囲でもう一度</button>
      <button id="goWrongBank" class="warn">登録中の間違い問題へ</button>
    </div>
    <div id="wrongArea" class="notice"></div>
  </section>

  <div id="emptyBox" class="empty">最初だけ「設定・成績」を開いてユーザー名を登録してください。登録後は自動で閉じます。</div>
  <div class="notice"><strong>スマホ：</strong>ユーザー登録 → 単元を選ぶ → 「スタート」を押すと、自動で問題の位置まで移動します。<br>選択肢をタップして回答すると「次へ」が押せるようになります。間違えた問題は自動登録され、正解すると登録から外れます。</div>
</div>

<div class="nav">
  <div class="navinner">
    <button id="prevBtn">← 前へ</button>
    <button id="nextBtn" class="primary">次へ</button>
    <button id="shuffleBtn">シャッフル</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"q": "Jim had a cold yesterday, but he (     ) fine today.", "c": ["breaks", "pulls", "feels", "means"], "a": 2, "e": "feel fine で「元気だ・具合がよい」。主語が he なので feels。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 1, "qid": "L01Q01"}, {"q": "A: Jenny, walk (     ) in the museum.\nB: Sorry, Ms. Brown. I’ll be careful.", "c": ["equally", "quietly", "clearly", "brightly"], "a": 1, "e": "博物館では「静かに」歩くので quietly。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 2, "qid": "L01Q02"}, {"q": "A: The new movie was really good.\nB: I didn’t think so. I don’t like the main actor, so I thought it was (     ).", "c": ["boring", "exciting", "glad", "fun"], "a": 0, "e": "I didn’t think so に続くので「退屈な」boring が合う。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 3, "qid": "L01Q03"}, {"q": "Susan likes to learn about other (     ). She travels to many countries during her vacations.", "c": ["accidents", "cultures", "prizes", "difficulties"], "a": 1, "e": "多くの国へ行くので learn about other cultures（他の文化を学ぶ）。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 4, "qid": "L01Q04"}, {"q": "A: Excuse me. May I (     ) your dictionary?\nB: Sure. Here you are.", "c": ["borrow", "mail", "lend", "write"], "a": 0, "e": "May I borrow ...? で「〜を借りてもいいですか」。lend は「貸す」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 5, "qid": "L01Q05"}, {"q": "Sarah couldn’t find her phone. She looked everywhere. (     ) last, she found it under her bed.", "c": ["At", "On", "In", "Of"], "a": 0, "e": "at last で「ついに・とうとう」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 6, "qid": "L01Q06"}, {"q": "Lucy and Fred talked (     ) the phone for about an hour last night.", "c": ["for", "out", "in", "on"], "a": 3, "e": "on the phone で「電話で」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 7, "qid": "L01Q07"}, {"q": "A: This sweater is too big. Can I (     ) on a smaller one?\nB: Sure. Here you are.", "c": ["make", "try", "serve", "push"], "a": 1, "e": "try on で「試着する」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 8, "qid": "L01Q08"}, {"q": "The sky is (     ) with clouds this morning, but it will be sunny in the afternoon.", "c": ["cover", "covered", "covers", "covering"], "a": 1, "e": "be covered with ... で「〜でおおわれている」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 9, "qid": "L01Q09"}, {"q": "A: Do you have a friend (     ) brother is a soccer player?\nB: No, I don’t.", "c": ["which", "whose", "whom", "who"], "a": 1, "e": "whose brother で「その兄弟が〜である友達」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 10, "qid": "L01Q10"}, {"q": "Susan walks in the park for an hour every morning for her (     ).", "c": ["package", "machine", "way", "health"], "a": 3, "e": "for her health で「健康のために」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 1, "qid": "L02Q01"}, {"q": "Ted watched TV (     ) his mother told him to go to bed.", "c": ["if", "during", "since", "until"], "a": 3, "e": "until で「〜するまで」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 2, "qid": "L02Q02"}, {"q": "A: I (     ) a cup of coffee for you, Jack.\nB: Thank you. That was kind of you.", "c": ["graduated", "worked", "ordered", "shared"], "a": 2, "e": "a cup of coffee を目的語に取れるのは ordered（注文した）。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 3, "qid": "L02Q03"}, {"q": "I will (     ) my friends to my birthday party next week.", "c": ["grow", "show", "move", "invite"], "a": 3, "e": "invite A to B で「AをBに招待する」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 4, "qid": "L02Q04"}, {"q": "There is (     ) time to eat lunch before the movie.", "c": ["able", "sure", "whole", "enough"], "a": 3, "e": "enough time で「十分な時間」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 5, "qid": "L02Q05"}, {"q": "A: Do you walk to school, Robert?\nB: No, Tim. It’s too (     ) from my house. I go by bike.", "c": ["heavy", "far", "high", "wrong"], "a": 1, "e": "It’s too far from my house. で「家から遠すぎる」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 6, "qid": "L02Q06"}, {"q": "A: Did you have a (     ) to go to the new Italian restaurant?\nB: No. I was busy.", "c": ["chance", "secret", "course", "support"], "a": 0, "e": "have a chance to ... で「〜する機会がある」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 7, "qid": "L02Q07"}, {"q": "A: You haven’t eaten anything this morning. Do you want to eat something?\nB: Thank you. I’d like to have a (     ) of bread.", "c": ["bowl", "pair", "slice", "sheet"], "a": 2, "e": "a slice of bread で「パン1枚」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 8, "qid": "L02Q08"}, {"q": "A: Let’s play tennis this afternoon, Jane.\nB: Sorry, Dan. I have a lot of things (     ) today.", "c": ["do", "done", "to do", "doing"], "a": 2, "e": "things to do で「やるべきこと」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 9, "qid": "L02Q09"}, {"q": "Mark got up (     ) than his mother this morning because he had to do his homework.", "c": ["early", "earlier", "earliest", "soon"], "a": 1, "e": "than があるので比較級 earlier。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 10, "qid": "L02Q10"}, {"q": "A: Hello. This is Bobby. May I speak to Lucy, please?\nB: I’m afraid you have the (     ) number.", "c": ["poor", "dark", "bad", "wrong"], "a": 3, "e": "wrong number で「番号が違います」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 1, "qid": "L03Q01"}, {"q": "A: Keiko, there are a lot of people in the room. I can’t sing in front of so many people.\nB: Don’t be so (     ), Tim. I know you can do it.", "c": ["busy", "lucky", "shy", "honest"], "a": 2, "e": "人前で歌えない→「恥ずかしがらないで」なので shy。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 2, "qid": "L03Q02"}, {"q": "I go to Nikko with my grandparents and (     ) a week every year.", "c": ["believe", "spend", "trust", "push"], "a": 1, "e": "spend a week で「1週間過ごす」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 3, "qid": "L03Q03"}, {"q": "Every year, Helen visits Canada (     ) her winter vacation.", "c": ["when", "while", "during", "between"], "a": 2, "e": "during her winter vacation で「冬休みの間に」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 4, "qid": "L03Q04"}, {"q": "Jonathan has club (     ) every Saturday afternoon.", "c": ["activities", "hobbies", "companies", "subjects"], "a": 0, "e": "club activities で「部活動」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 5, "qid": "L03Q05"}, {"q": "A: Please (     ) off the TV. The baby is sleeping.\nB: Oh, I’m sorry. I didn’t know.", "c": ["take", "go", "put", "turn off"], "a": 3, "e": "turn off the TV で「テレビを消す」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 6, "qid": "L03Q06"}, {"q": "A: Please take a seat and make (     ) at home.\nB: Thank you.", "c": ["you", "your", "yours", "yourself"], "a": 3, "e": "make yourself at home で「どうぞくつろいで」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 7, "qid": "L03Q07"}, {"q": "I met Jimmy on the (     ) to school this morning. We talked about next month’s school trip.", "c": ["way", "minute", "pair", "goal"], "a": 0, "e": "on the way to school で「学校へ行く途中で」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 8, "qid": "L03Q08"}, {"q": "A: Who is the woman (     ) by the car?\nB: That woman with long hair? She’s our new music teacher, Ms. Young.", "c": ["stand", "to stand", "stood", "standing"], "a": 3, "e": "the woman standing by the car で「車のそばに立っている女性」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 9, "qid": "L03Q09"}, {"q": "A: Do you have two cameras?\nB: Yes. This new camera is (     ) bigger than the other.", "c": ["many", "well", "very", "much"], "a": 3, "e": "much bigger で「ずっと大きい」。比較級を強める much。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 10, "qid": "L03Q10"}, {"q": "A: Are you looking for (     ) special?\nB: Yes, a computer. I want something light and small.", "c": ["either", "anything", "little", "one"], "a": 1, "e": "疑問文では anything special（何か特別なもの）が自然。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 1, "qid": "L04Q01"}, {"q": "The baseball player (     ) to go to the U.S. to play in the major leagues.", "c": ["received", "climbed", "collected", "decided"], "a": 3, "e": "decide to ... で「〜することに決める」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 2, "qid": "L04Q02"}, {"q": "Many people carry their smartphones everywhere because they are very (     ).", "c": ["useful", "careful", "foreign", "proud"], "a": 0, "e": "スマホは「便利な」ので useful。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 3, "qid": "L04Q03"}, {"q": "A: Excuse me, can you tell me the way to the city library?\nB: Sorry. I’m a (     ) around here.", "c": ["mayor", "stranger", "singer", "librarian"], "a": 1, "e": "I’m a stranger around here. で「この辺に詳しくないんです」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 4, "qid": "L04Q04"}, {"q": "A: Why are you late, Ken?\nB: My alarm clock didn’t (     ) this morning.", "c": ["become", "pass", "bring", "work"], "a": 3, "e": "alarm clock didn’t work で「目覚ましが鳴らなかった／作動しなかった」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 5, "qid": "L04Q05"}, {"q": "A: Where do you get (     ) the bus?\nB: At the next bus stop.", "c": ["off", "down", "under", "over"], "a": 0, "e": "get off the bus で「バスを降りる」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 6, "qid": "L04Q06"}, {"q": "A: (     ) off your T-shirt, Tom. It’s so dirty.\nB: Yes, Mom. I’ll put it in the washing machine.", "c": ["Take", "Carry", "Build", "Lend"], "a": 0, "e": "take off で「脱ぐ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 7, "qid": "L04Q07"}, {"q": "The town is famous (     ) its beautiful mountains.", "c": ["to", "in", "at", "for"], "a": 3, "e": "be famous for ... で「〜で有名だ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 8, "qid": "L04Q08"}, {"q": "Henry hasn’t (     ) his homework yet, so he can’t play with his brother.", "c": ["finish", "finishing", "finishes", "finished"], "a": 3, "e": "hasn’t finished ... yet で現在完了の形。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 9, "qid": "L04Q09"}, {"q": "I love traveling abroad. It makes (     ) happy.", "c": ["my", "our", "we", "me"], "a": 3, "e": "make me happy で「私を幸せにする」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 10, "qid": "L04Q10"}, {"q": "Boy: const APP_KEY = 'english-smart-quiz-users-v1';
const DEFAULT_STORE = { users: [], currentUser: '', profiles: {} };
let store = loadStore();

let currentSet = [];
let baseSet = [];
let currentIndex = 0;
let answered = false;
let sessionCorrect = 0;
let sessionWrong = [];
let currentMode = 'normal';
let currentLabel = '';

const $ = id => document.getElementById(id);
function loadStore(){
  try {
    var raw = localStorage.getItem(APP_KEY);
    var obj = raw ? JSON.parse(raw) : null;
    if (!obj || typeof obj !== 'object') return JSON.parse(JSON.stringify(DEFAULT_STORE));
    obj.users = Array.isArray(obj.users) ? obj.users : [];
    obj.currentUser = obj.currentUser || '';
    obj.profiles = obj.profiles && typeof obj.profiles === 'object' ? obj.profiles : {};
    return obj;
  } catch(e){
    return JSON.parse(JSON.stringify(DEFAULT_STORE));
  }
}
function saveStore(){
  try { localStorage.setItem(APP_KEY, JSON.stringify(store)); }
  catch(e) { console.warn('保存できませんでした', e); }
}
function ensureProfile(name){
  if (!store.profiles[name]) {
    store.profiles[name] = { correct:0, sessions:0, history:[], wrongBank:[], solved:{} };
  }
  if (!Array.isArray(store.profiles[name].wrongBank)) store.profiles[name].wrongBank = [];
  if (!store.profiles[name].solved || typeof store.profiles[name].solved !== 'object') store.profiles[name].solved = {};
  if (!Array.isArray(store.profiles[name].history)) store.profiles[name].history = [];
  return store.profiles[name];
}
function currentUser(){ return store.currentUser || ''; }
function currentProfile(){ return currentUser() ? ensureProfile(currentUser()) : null; }
function refreshUsersUI(){
  const sel = $('userSelect');
  sel.innerHTML = '<option value="">登録済みユーザーを選ぶ</option>';
  store.users.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    if (name === store.currentUser) o.selected = true;
    sel.appendChild(o);
  });
  $('currentUserText').textContent = '現在のユーザー：' + (store.currentUser || '未選択');
  $('miniUser').textContent = store.currentUser || '未選択';
  const hasUser = !!store.currentUser;
  $('emptyBox').classList.toggle('hidden', hasUser);
  updateSavedStats();
  if (!hasUser) $('settingsPanel').open = true;
}
function updateSavedStats(){
  const prof = currentProfile();
  $('savedCorrect').textContent = prof ? (prof.correct || 0) : 0;
  $('savedSessions').textContent = prof ? (prof.sessions || 0) : 0;
  const wrongCount = prof ? (prof.wrongBank || []).length : 0;
  $('savedWrongBank').textContent = wrongCount;
  $('miniWrong').textContent = wrongCount;
}
function setCurrentUser(name){
  if (!name) return;
  ensureProfile(name);
  store.currentUser = name;
  saveStore();
  refreshUsersUI();
}
function addUser(){
  const name = $('newUserName').value.trim();
  if (!name) { alert('ユーザー名を入力してください。'); return; }
  if (!store.users.includes(name)) store.users.push(name);
  setCurrentUser(name);
  $('newUserName').value = '';
  $('settingsPanel').open = false;
}
function switchUser(){
  const name = $('userSelect').value;
  if (!name) { alert('切り替えるユーザーを選んでください。'); return; }
  setCurrentUser(name);
  $('settingsPanel').open = false;
}
function deleteUser(){
  const name = $('userSelect').value || currentUser();
  if (!name) { alert('削除するユーザーがありません。'); return; }
  if (!confirm('ユーザー「' + name + '」を削除しますか？\n学習記録も削除されます。')) return;
  store.users = store.users.filter(u => u !== name);
  delete store.profiles[name];
  if (store.currentUser === name) store.currentUser = store.users[0] || '';
  saveStore();
  refreshUsersUI();
}
function selectedLessonValue(){ return $('lessonSelect').value; }
function buildBaseSet(fromWrongBank=false){
  const val = selectedLessonValue();
  const prof = currentProfile();
  let set = [];
  if (!prof) return [];
  if (fromWrongBank) {
    const ids = new Set(prof.wrongBank || []);
    set = ALL_QUESTIONS.filter(q => ids.has(q.qid));
    if (val !== 'all') set = set.filter(q => String(q.lesson) === val);
  } else {
    set = val === 'all' ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => String(q.lesson) === val);
  }
  $('targetCount').textContent = set.length + '問';
  return set;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function requireUser(){
  if (!currentUser()) {
    alert('先にユーザー登録またはユーザー選択をしてください。');
    return false;
  }
  return true;
}
function startSession(mode){
  if (!requireUser()) return;
  if (mode === 'wrongbank') {
    baseSet = buildBaseSet(true);
    currentLabel = '登録した間違い問題';
  } else {
    baseSet = buildBaseSet(false);
    currentLabel = mode === 'random' ? 'ランダム10問' : '通常問題';
  }
  if (!baseSet.length) {
    alert(mode === 'wrongbank' ? '登録されている間違い問題がありません。' : '問題がありません。');
    return;
  }
  currentMode = mode;
  $('settingsPanel').open = false;
  currentSet = mode === 'random' ? shuffle(baseSet).slice(0, Math.min(10, baseSet.length)) : [...baseSet];
  currentIndex = 0;
  answered = false;
  sessionCorrect = 0;
  sessionWrong = [];
  $('resultCard').classList.remove('show');
  $('quizCard').classList.remove('hidden');
  renderQuestion();
  setTimeout(function(){
    var card = document.getElementById('quizCard');
    if (card && card.scrollIntoView) card.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}
function startRetryWrong(){
  if (!sessionWrong.length) return;
  currentSet = [...sessionWrong];
  currentIndex = 0;
  answered = false;
  sessionCorrect = 0;
  sessionWrong = [];
  currentMode = 'retry';
  currentLabel = '今回の間違いだけ再テスト';
  $('resultCard').classList.remove('show');
  $('quizCard').classList.remove('hidden');
  renderQuestion();
  setTimeout(function(){
    var card = document.getElementById('quizCard');
    if (card && card.scrollIntoView) card.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}
function renderQuestion(){
  const item = currentSet[currentIndex];
  $('lessonBadge').textContent = currentLabel;
  $('qhead').textContent = `第${item.lesson}回 ${item.lessonTitle} / 問${item.no} / ${item.qid}`;
  $('countText').textContent = `${currentIndex+1} / ${currentSet.length}`;
  $('question').textContent = item.q;
  $('progressBar').style.width = ((currentIndex) / currentSet.length * 100) + '%';
  const choices = $('choices');
  choices.innerHTML = '';
  item.c.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice';
    btn.innerHTML = `<strong>${idx+1}.</strong> ${choice}`;
    btn.addEventListener('click', () => answer(idx));
    choices.appendChild(btn);
  });
  answered = false;
  $('feedback').className = 'feedback';
  $('fbTitle').textContent = '';
  $('fbBody').textContent = '';
  updateNavButtons();
}
function answer(idx){
  if(answered) return;
  answered = true;
  const item = currentSet[currentIndex];
  const prof = currentProfile();
  const buttons = [...$('choices').querySelectorAll('.choice')];
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === item.a) b.classList.add('correct');
    if (i === idx && i !== item.a) b.classList.add('wrong');
  });
  if (!prof.solved[item.qid]) prof.solved[item.qid] = { correct:0, wrong:0 };
  const correct = idx === item.a;
  $('feedback').classList.add('show');
  if (correct) {
    sessionCorrect += 1;
    prof.correct = (prof.correct || 0) + 1;
    prof.solved[item.qid].correct += 1;
    prof.wrongBank = (prof.wrongBank || []).filter(id => id !== item.qid);
    $('fbTitle').textContent = '○ 正解！';
    $('feedback').classList.add('ok');
  } else {
    prof.solved[item.qid].wrong += 1;
    if (!(prof.wrongBank || []).includes(item.qid)) prof.wrongBank.push(item.qid);
    sessionWrong.push(item);
    $('fbTitle').textContent = '× ちがいます';
    $('feedback').classList.add('ng');
  }
  $('fbBody').textContent = `正解：${item.a+1}. ${item.c[item.a]}\n解説：${item.e}`;
  saveStore();
  updateSavedStats();
  updateNavButtons();
}
function nextQuestion(){
  if (!currentSet.length || !answered) return;
  if (currentIndex < currentSet.length - 1) {
    currentIndex += 1;
    renderQuestion();
  } else {
    finishSession();
  }
}
function prevQuestion(){
  if (!currentSet.length || currentIndex === 0) return;
  currentIndex -= 1;
  renderQuestion();
}
function finishSession(){
  const prof = currentProfile();
  prof.sessions = (prof.sessions || 0) + 1;
  prof.history = prof.history || [];
  prof.history.push({
    date: new Date().toISOString(),
    mode: currentMode,
    total: currentSet.length,
    correct: sessionCorrect,
    wrong: currentSet.length - sessionCorrect
  });
  saveStore();
  $('quizCard').classList.add('hidden');
  $('resultCard').classList.add('show');
  $('resultScore').textContent = `${sessionCorrect} / ${currentSet.length} 問 正解`;
  const rate = Math.round(sessionCorrect / currentSet.length * 100);
  $('resultMessage').innerHTML = `正答率は <strong>${rate}%</strong> です。` +
    (sessionWrong.length ? ` 今回の間違いは <strong>${sessionWrong.length}問</strong>。下のボタンで今回の間違いだけ解き直せます。` : ` 全問正解です。`);
  $('wrongArea').innerHTML = sessionWrong.length
    ? "<strong>今回間違えた問題：</strong><ul class='list'>" + sessionWrong.map(q => `<li>第${q.lesson}回 ${q.lessonTitle} / 問${q.no} / ${q.qid}</li>`).join('') + '</ul>'
    : `<strong>登録中の間違い問題：</strong> ${(prof.wrongBank || []).length}問`;
  $('retryWrong').disabled = sessionWrong.length === 0;
  $('retryWrong').style.opacity = sessionWrong.length === 0 ? '0.45' : '1';
  $('progressBar').style.width = '100%';
  updateSavedStats();
}
function updateNavButtons(){
  const hide = $('quizCard').classList.contains('hidden');
  $('prevBtn').disabled = currentIndex === 0 || hide;
  $('nextBtn').disabled = !answered || hide;
  $('nextBtn').textContent = currentIndex === currentSet.length - 1 ? '結果へ' : '次へ';
}
$('addUserBtn').addEventListener('click', addUser);
$('switchUserBtn').addEventListener('click', switchUser);
$('deleteUserBtn').addEventListener('click', deleteUser);
$('startNormal').addEventListener('click', () => startSession('normal'));
$('startRandom').addEventListener('click', () => startSession('random'));
$('startWrongBank').addEventListener('click', () => startSession('wrongbank'));
$('jumpQuizBtn').addEventListener('click', function(){
  var card = document.getElementById('quizCard');
  if (card && !card.classList.contains('hidden')) {
    card.scrollIntoView({behavior:'smooth', block:'start'});
  } else {
    alert('先に「スタート」または「ランダム10問」を押してください。');
  }
});
$('retryWrong').addEventListener('click', startRetryWrong);
$('restartSame').addEventListener('click', () => startSession(currentMode === 'random' ? 'random' : (currentMode === 'wrongbank' ? 'wrongbank' : 'normal')));
$('goWrongBank').addEventListener('click', () => startSession('wrongbank'));
$('prevBtn').addEventListener('click', prevQuestion);
$('nextBtn').addEventListener('click', nextQuestion);
$('shuffleBtn').addEventListener('click', () => startSession('random'));
$('lessonSelect').addEventListener('change', () => { buildBaseSet(false); });
$('newUserName').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });
try {
  refreshUsersUI();
  buildBaseSet(false);
  updateNavButtons();
} catch(e) {
  var c = document.getElementById('compatText');
  if (c) c.textContent = '初期化エラー：ページを再読み込みしてください';
  console.error(e);
}
</script>
</body>
</html>
