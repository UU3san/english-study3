<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語スマホ問題集 第1回〜第8回</title>
<style>
:root {
  --bg:#f6f7f8; --card:#ffffff; --text:#17212b; --muted:#5f6b76; --line:#d9e0e6;
  --accent:#2563eb; --accent2:#1d4ed8; --ok:#15803d; --ng:#b91c1c; --soft:#eef4ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,select{font:inherit}
a{color:var(--accent2)}
.app{max-width:820px;margin:0 auto;padding:12px 12px 84px}
.header{position:sticky;top:0;z-index:10;background:rgba(246,247,248,.96);backdrop-filter:blur(6px);padding-bottom:10px}
h1{font-size:20px;margin:0;padding-top:4px}
.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .label{font-size:12px;color:var(--muted)}
.stat .value{font-size:18px;font-weight:700;margin-top:4px}
.progress{height:8px;border-radius:999px;overflow:hidden;background:#dfe7ee;margin-top:10px}
.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent2);font-weight:700}
.qhead{font-size:14px;color:var(--muted);margin-top:4px}
.question{font-size:19px;line-height:1.7;white-space:pre-line;margin-top:10px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:52px;line-height:1.55}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:#86efac;background:#f0fdf4}
.choice.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line)}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border-color:#86efac}
.feedback.ng{background:#fef2f2;border-color:#fca5a5}
.feedback .title{font-weight:800;font-size:18px}
.feedback .body{font-size:14px;line-height:1.75;margin-top:6px;white-space:pre-line}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.navinner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.result{display:none}
.result.show{display:block}
.list{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.8}
.notice{font-size:13px;color:var(--muted);line-height:1.7;margin-top:12px}
.inline-link{font-size:14px;margin-top:10px}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none !important}
@media (max-width:420px) {
  .stats{grid-template-columns:1fr}
  .question{font-size:18px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>英語スマホ問題集　第1回〜第8回</h1>
    <div class="sub">タップで解答 → その場で○× → 日本語解説 → 間違いだけ再テスト。<br>今回は、画像教材のうち<strong>第1回〜第8回（全80問）</strong>をスマホ問題集にしました。</div>

    <div class="row">
      <select id="lessonSelect">
        <option value="all">全80問（1〜8回まとめ）</option>
        <option value="1">第1回 短文①</option>
        <option value="2">第2回 短文②</option>
        <option value="3">第3回 短文③</option>
        <option value="4">第4回 短文④</option>
        <option value="5">第5回 会話①</option>
        <option value="6">第6回 会話②</option>
        <option value="7">第7回 会話③</option>
        <option value="8">第8回 会話④</option>
      </select>
      <button id="startNormal" class="primary">通常スタート</button>
      <button id="startRandom" class="ghost">ランダム10問</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">今回の対象</div><div class="value" id="targetCount">80問</div></div>
      <div class="stat"><div class="label">これまでの正解数</div><div class="value" id="savedCorrect">0</div></div>
      <div class="stat"><div class="label">これまでの学習回数</div><div class="value" id="savedSessions">0</div></div>
    </div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>
    <div class="inline-link"><a href="image-study.html">元の画像学習版を見る</a></div>
  </div>

  <section id="quizCard" class="card hidden">
    <div class="meta">
      <div>
        <div id="lessonBadge" class="badge"></div>
        <div id="qhead" class="qhead"></div>
      </div>
      <div id="countText" class="small"></div>
    </div>

    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback">
      <div id="fbTitle" class="title"></div>
      <div id="fbBody" class="body"></div>
    </div>
  </section>

  <section id="resultCard" class="card result">
    <div class="badge">学習結果</div>
    <h2 id="resultScore" style="margin:12px 0 0;font-size:28px"></h2>
    <div id="resultMessage" class="notice"></div>
    <div class="row">
      <button id="retryWrong" class="primary">間違いだけ再テスト</button>
      <button id="restartSame" class="ghost">同じ範囲でもう一度</button>
    </div>
    <div id="wrongArea" class="notice"></div>
  </section>

  <div class="notice">
    使い方：単元を選ぶ → スタート → 選択肢をタップ。<br>
    学習履歴はこの端末のブラウザに保存されます。
  </div>
</div>

<div class="nav">
  <div class="navinner">
    <button id="prevBtn">← 前へ</button>
    <button id="nextBtn" class="primary">次へ</button>
    <button id="shuffleBtn">シャッフル</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"q": "Jim had a cold yesterday, but he (     ) fine today.", "c": ["breaks", "pulls", "feels", "means"], "a": 2, "e": "feel fine で「元気だ・具合がよい」。主語が he なので feels。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 1}, {"q": "A: Jenny, walk (     ) in the museum.\nB: Sorry, Ms. Brown. I’ll be careful.", "c": ["equally", "quietly", "clearly", "brightly"], "a": 1, "e": "博物館では「静かに」歩くので quietly。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 2}, {"q": "A: The new movie was really good.\nB: I didn’t think so. I don’t like the main actor, so I thought it was (     ).", "c": ["boring", "exciting", "glad", "fun"], "a": 0, "e": "I didn’t think so に続くので「退屈な」boring が合う。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 3}, {"q": "Susan likes to learn about other (     ). She travels to many countries during her vacations.", "c": ["accidents", "cultures", "prizes", "difficulties"], "a": 1, "e": "多くの国へ行くので learn about other cultures（他の文化を学ぶ）。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 4}, {"q": "A: Excuse me. May I (     ) your dictionary?\nB: Sure. Here you are.", "c": ["borrow", "mail", "lend", "write"], "a": 0, "e": "May I borrow ...? で「〜を借りてもいいですか」。lend は「貸す」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 5}, {"q": "Sarah couldn’t find her phone. She looked everywhere. (     ) last, she found it under her bed.", "c": ["At", "On", "In", "Of"], "a": 0, "e": "at last で「ついに・とうとう」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 6}, {"q": "Lucy and Fred talked (     ) the phone for about an hour last night.", "c": ["for", "out", "in", "on"], "a": 3, "e": "on the phone で「電話で」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 7}, {"q": "A: This sweater is too big. Can I (     ) on a smaller one?\nB: Sure. Here you are.", "c": ["make", "try", "serve", "push"], "a": 1, "e": "try on で「試着する」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 8}, {"q": "The sky is (     ) with clouds this morning, but it will be sunny in the afternoon.", "c": ["cover", "covered", "covers", "covering"], "a": 1, "e": "be covered with ... で「〜でおおわれている」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 9}, {"q": "A: Do you have a friend (     ) brother is a soccer player?\nB: No, I don’t.", "c": ["which", "whose", "whom", "who"], "a": 1, "e": "whose brother で「その兄弟が〜である友達」。", "lesson": 1, "lessonTitle": "短文の語句空所補充①", "no": 10}, {"q": "Susan walks in the park for an hour every morning for her (     ).", "c": ["package", "machine", "way", "health"], "a": 3, "e": "for her health で「健康のために」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 1}, {"q": "Ted watched TV (     ) his mother told him to go to bed.", "c": ["if", "during", "since", "until"], "a": 3, "e": "until で「〜するまで」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 2}, {"q": "A: I (     ) a cup of coffee for you, Jack.\nB: Thank you. That was kind of you.", "c": ["graduated", "worked", "ordered", "shared"], "a": 2, "e": "a cup of coffee を目的語に取れるのは ordered（注文した）。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 3}, {"q": "I will (     ) my friends to my birthday party next week.", "c": ["grow", "show", "move", "invite"], "a": 3, "e": "invite A to B で「AをBに招待する」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 4}, {"q": "There is (     ) time to eat lunch before the movie.", "c": ["able", "sure", "whole", "enough"], "a": 3, "e": "enough time で「十分な時間」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 5}, {"q": "A: Do you walk to school, Robert?\nB: No, Tim. It’s too (     ) from my house. I go by bike.", "c": ["heavy", "far", "high", "wrong"], "a": 1, "e": "It’s too far from my house. で「家から遠すぎる」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 6}, {"q": "A: Did you have a (     ) to go to the new Italian restaurant?\nB: No. I was busy.", "c": ["chance", "secret", "course", "support"], "a": 0, "e": "have a chance to ... で「〜する機会がある」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 7}, {"q": "A: You haven’t eaten anything this morning. Do you want to eat something?\nB: Thank you. I’d like to have a (     ) of bread.", "c": ["bowl", "pair", "slice", "sheet"], "a": 2, "e": "a slice of bread で「パン1枚」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 8}, {"q": "A: Let’s play tennis this afternoon, Jane.\nB: Sorry, Dan. I have a lot of things (     ) today.", "c": ["do", "done", "to do", "doing"], "a": 2, "e": "things to do で「やるべきこと」。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 9}, {"q": "Mark got up (     ) than his mother this morning because he had to do his homework.", "c": ["early", "earlier", "earliest", "soon"], "a": 1, "e": "than があるので比較級 earlier。", "lesson": 2, "lessonTitle": "短文の語句空所補充②", "no": 10}, {"q": "A: Hello. This is Bobby. May I speak to Lucy, please?\nB: I’m afraid you have the (     ) number.", "c": ["poor", "dark", "bad", "wrong"], "a": 3, "e": "wrong number で「番号が違います」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 1}, {"q": "A: Keiko, there are a lot of people in the room. I can’t sing in front of so many people.\nB: Don’t be so (     ), Tim. I know you can do it.", "c": ["busy", "lucky", "shy", "honest"], "a": 2, "e": "人前で歌えない→「恥ずかしがらないで」なので shy。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 2}, {"q": "I go to Nikko with my grandparents and (     ) a week every year.", "c": ["believe", "spend", "trust", "push"], "a": 1, "e": "spend a week で「1週間過ごす」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 3}, {"q": "Every year, Helen visits Canada (     ) her winter vacation.", "c": ["when", "while", "during", "between"], "a": 2, "e": "during her winter vacation で「冬休みの間に」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 4}, {"q": "Jonathan has club (     ) every Saturday afternoon.", "c": ["activities", "hobbies", "companies", "subjects"], "a": 0, "e": "club activities で「部活動」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 5}, {"q": "A: Please (     ) off the TV. The baby is sleeping.\nB: Oh, I’m sorry. I didn’t know.", "c": ["take", "go", "put", "turn off"], "a": 3, "e": "turn off the TV で「テレビを消す」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 6}, {"q": "A: Please take a seat and make (     ) at home.\nB: Thank you.", "c": ["you", "your", "yours", "yourself"], "a": 3, "e": "make yourself at home で「どうぞくつろいで」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 7}, {"q": "I met Jimmy on the (     ) to school this morning. We talked about next month’s school trip.", "c": ["way", "minute", "pair", "goal"], "a": 0, "e": "on the way to school で「学校へ行く途中で」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 8}, {"q": "A: Who is the woman (     ) by the car?\nB: That woman with long hair? She’s our new music teacher, Ms. Young.", "c": ["stand", "to stand", "stood", "standing"], "a": 3, "e": "the woman standing by the car で「車のそばに立っている女性」。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 9}, {"q": "A: Do you have two cameras?\nB: Yes. This new camera is (     ) bigger than the other.", "c": ["many", "well", "very", "much"], "a": 3, "e": "much bigger で「ずっと大きい」。比較級を強める much。", "lesson": 3, "lessonTitle": "短文の語句空所補充③", "no": 10}, {"q": "A: Are you looking for (     ) special?\nB: Yes, a computer. I want something light and small.", "c": ["either", "anything", "little", "one"], "a": 1, "e": "疑問文では anything special（何か特別なもの）が自然。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 1}, {"q": "The baseball player (     ) to go to the U.S. to play in the major leagues.", "c": ["received", "climbed", "collected", "decided"], "a": 3, "e": "decide to ... で「〜することに決める」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 2}, {"q": "Many people carry their smartphones everywhere because they are very (     ).", "c": ["useful", "careful", "foreign", "proud"], "a": 0, "e": "スマホは「便利な」ので useful。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 3}, {"q": "A: Excuse me, can you tell me the way to the city library?\nB: Sorry. I’m a (     ) around here.", "c": ["mayor", "stranger", "singer", "librarian"], "a": 1, "e": "I’m a stranger around here. で「この辺に詳しくないんです」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 4}, {"q": "A: Why are you late, Ken?\nB: My alarm clock didn’t (     ) this morning.", "c": ["become", "pass", "bring", "work"], "a": 3, "e": "alarm clock didn’t work で「目覚ましが鳴らなかった／作動しなかった」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 5}, {"q": "A: Where do you get (     ) the bus?\nB: At the next bus stop.", "c": ["off", "down", "under", "over"], "a": 0, "e": "get off the bus で「バスを降りる」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 6}, {"q": "A: (     ) off your T-shirt, Tom. It’s so dirty.\nB: Yes, Mom. I’ll put it in the washing machine.", "c": ["Take", "Carry", "Build", "Lend"], "a": 0, "e": "take off で「脱ぐ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 7}, {"q": "The town is famous (     ) its beautiful mountains.", "c": ["to", "in", "at", "for"], "a": 3, "e": "be famous for ... で「〜で有名だ」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 8}, {"q": "Henry hasn’t (     ) his homework yet, so he can’t play with his brother.", "c": ["finish", "finishing", "finishes", "finished"], "a": 3, "e": "hasn’t finished ... yet で現在完了の形。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 9}, {"q": "I love traveling abroad. It makes (     ) happy.", "c": ["my", "our", "we", "me"], "a": 3, "e": "make me happy で「私を幸せにする」。", "lesson": 4, "lessonTitle": "短文の語句空所補充④", "no": 10}, {"q": "Boy: I have to wash my father’s car.\nGirl: (     )\nBoy: Thank you, but I can do it by myself.", "c": ["What can I do for you?", "Can I help you?", "Do you know why?", "Can you drive me home?"], "a": 1, "e": "返答が Thank you なので「手伝おうか？」の Can I help you? が合う。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 1}, {"q": "Boy: How was your drama contest?\nGirl: Our club didn’t win first prize.\nBoy: (     ) I hope you do better next time.", "c": ["That’s good.", "Sorry to hear that.", "No, thank you.", "Not at all."], "a": 1, "e": "残念な結果に対しては Sorry to hear that. が自然。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 2}, {"q": "Man: Excuse me. How long does it take to walk to the park?\nWoman: (     )\nMan: Thank you. Have a good day.", "c": ["About two miles.", "About five years ago.", "About three thousand yen.", "About thirty minutes."], "a": 3, "e": "How long は時間を聞いているので About thirty minutes。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 3}, {"q": "Son: Dad, I have a baseball game next Wednesday. (     )\nFather: Of course. I’ll be there to support you.", "c": ["Can you come and see it?", "Would you like something to eat?", "Can you buy me new gloves?", "When will you be back?"], "a": 0, "e": "父の返答から「見に来てくれる？」が合う。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 4}, {"q": "Woman: What would you like to have for lunch?\nMan: (     )\nWoman: Let’s go to an Italian restaurant, then.", "c": ["Anything is fine.", "I should go home.", "I’m sorry, but I can’t.", "You’re very kind."], "a": 0, "e": "次に店を決めているので「何でもいいよ」が自然。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 5}, {"q": "Girl 1: Your coat is very nice! (     ) Kim?\nGirl 2: My mom bought it for me as a birthday present.", "c": ["Where were you going,", "Where did you get it,", "What color is it,", "When was your birthday,"], "a": 1, "e": "買ってもらったという返答なので Where did you get it? が合う。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 6}, {"q": "Boy: I’m sorry I didn’t call you last night. I went to bed early.\nGirl: (     ) I did, too.", "c": ["No problem.", "Not really.", "That’s too bad.", "Yes, please."], "a": 0, "e": "謝罪に対しては No problem. が自然。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 7}, {"q": "Boy: Hello, this is Bill. Is Yusuke there?\nGirl: (     ) He’s at the park.", "c": ["I’ve already done it.", "I think you know him.", "I can’t hear you.", "I’m afraid he’s not."], "a": 3, "e": "不在を伝える定番表現 I’m afraid he’s not.。", "lesson": 5, "lessonTitle": "会話文の空所補充①", "no": 8}, {"q": "Mother: You don’t look good. (     )\nSon: My throat hurts.\nMother: Maybe you have a cold.", "c": ["What’s the matter?", "What are you doing?", "Anything else?", "Can you help me now?"], "a": 0, "e": "体調が悪そう is my first visit への問いは Have you ever been there before?。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 2}, {"q": "Man: I’d like to talk to Ms. Smith, please.\nWoman: I’m sorry, but she’s out now. (     )\nMan: Yes, please tell her I’m going to be late for the meeting.", "c": ["Can I take a message?", "Please try again.", "Will you call her back?", "I think I know him, too."], "a": 0, "e": "不在なので Can I take a message?（伝言を承りましょうか）。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 3}, {"q": "Waiter: Here’s your sandwich. Would you like anything else?\nCustomer: Could I have a cup of tea, please?\nWaiter: Sure. (     )", "c": ["I can do it by myself.", "Take it easy.", "Congratulations.", "Just a moment, sir."], "a": 3, "e": "店員の返答なので Just a moment, sir. が自然。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 4}, {"q": "Woman 1: Why don’t we go to a movie this weekend?\nWoman 2: (     ) I’ve wanted to see that new comedy.", "c": ["That sounds good.", "That’s too expensive.", "Have fun.", "Never mind."], "a": 0, "e": "映画に賛成しているので That sounds good.。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 5}, {"q": "Girl: Richard, let’s go to the cafeteria.\nBoy: (     ) I need to talk to Mr. Jackson. I’ll meet you there.", "c": ["Please come again.", "You go ahead.", "Please help me.", "You can get away."], "a": 1, "e": "先に行っていて、という意味で You go ahead.。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 6}, {"q": "Sister: Are you ready for your class ski trip?\nBrother: Almost. I can’t find my ski cap. (     )\nSister: Of course.", "c": ["Can I help you?", "Please try again.", "Please ask me.", "Can I borrow yours?"], "a": 3, "e": "Of course への前文は「君のを借りてもいい？」。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 7}, {"q": "Clerk: Can I help you with anything?\nCustomer: Yes. I’m looking for a purse.\nClerk: (     ) It’s on sale.", "c": ["I agree with you.", "How much is this?", "How do you like this one?", "It’s just 2,000 yen."], "a": 2, "e": "店員が商品を勧めているので How do you like this one? が合う。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 8}, {"q": "Mother: Have you cleaned your room yet, Andy?\nSon: No, not yet.\nMother: (     )", "c": ["It’s in your room.", "Start cleaning it right away.", "See you there.", "You can’t do it."], "a": 1, "e": "まだなら「すぐに掃除を始めなさい」が自然。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 9}, {"q": "Boy: Do you know where Mr. Peterson is?\nGirl: (     ) Maybe he’s in the gym.", "c": ["You can’t miss it.", "I like it, too.", "It’s for you.", "I’m not sure."], "a": 3, "e": "Maybe と推測しているので I’m not sure.。", "lesson": 7, "lessonTitle": "会話文の空所補充③", "no": 10}, {"q": "Boy: It’s raining. I left my umbrella at home.\nGirl: Don’t worry. (     ) I have another one.\nBoy: Thank you.", "c": ["I’ll lend you mine.", "I’m afraid you can’t.", "I hope it gets warm.", "I think so."], "a": 0, "e": "I have another one とあるので「私のを貸すよ」I’ll lend you mine.。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 1}, {"q": "Girl: How about going to the art museum next Saturday?\nBoy: (     )\nGirl: I’ll see you at the entrance at two.", "c": ["I’m learning a lot.", "It’s over there.", "I’ll go there by train.", "That would be great."], "a": 3, "e": "提案に賛成しているので That would be great.。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 2}, {"q": "Teacher: Why didn’t you do your homework?\nStudent: I’m sorry. I had a headache and went to bed early last night.\nTeacher: I see. (     )", "c": ["Please give it to me tomorrow.", "I can show you how.", "The homework is ready.", "I went to the doctor."], "a": 0, "e": "事情を聞いたあとの指示として Please give it to me tomorrow. が自然。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 3}, {"q": "Mother: What’s wrong?\nSon: I’m worried about my test tomorrow.\nMother: You’ll be fine. (     )", "c": ["I’ll have one.", "Just do your best.", "You don’t like studying.", "It starts soon."], "a": 1, "e": "心配している相手への励ましは Just do your best.。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 4}, {"q": "Girl: You didn’t come to school yesterday. (     )\nBoy: I had to go to the dentist.", "c": ["How’s the weather?", "How did you go there?", "What happened?", "What’s the date today?"], "a": 2, "e": "欠席理由を聞くので What happened? が合う。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 5}, {"q": "Waiter: Would you like some coffee?\nCustomer: No, thank you. (     )\nWaiter: Sure. I’ll be right back.", "c": ["Is the restaurant open?", "Are you ready?", "Can I have some tea instead?", "Can I help you?"], "a": 2, "e": "コーヒーの代わりに紅茶を頼む流れ。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 6}, {"q": "Man: Why don’t we go to the new Italian restaurant this evening?\nWoman: (     ) but I can’t. I have to go home early today.", "c": ["I don’t have any,", "It’s tomorrow,", "I had spaghetti,", "Thank you for inviting me,"], "a": 3, "e": "誘いを断る前の定番表現は Thank you for inviting me, but ...。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 7}, {"q": "Boy: I went to the science museum yesterday.\nGirl: How was it?\nBoy: Really interesting. (     )", "c": ["Let’s go together some day.", "It’s time to go.", "I’ll see you there.", "Maybe some other time."], "a": 0, "e": "興味深かった→「今度いっしょに行こうよ」が自然。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 8}, {"q": "Boy: Have a nice holiday.\nGirl: (     ) See you next week.", "c": ["Let me see.", "I’ll get it.", "Same to you.", "I don’t know yet."], "a": 2, "e": "Have a nice holiday への返事は Same to you.。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 9}, {"q": "Boy 1: Are you going to the soccer game this weekend?\nBoy 2: (     ) I’m a fan of the Reds.\nBoy 1: Me, too.", "c": ["Of course, I am.", "You missed it.", "That’s OK.", "No, thank you."], "a": 0, "e": "ファンなので「もちろん行くよ」Of course, I am. が合う。", "lesson": 8, "lessonTitle": "会話文の空所補充④", "no": 10}];
const STORAGE_KEY = "english-smart-quiz-v2";
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"sessions":0,"correct":0,"history":[]}');

let currentSet = [];
let baseSet = [];
let currentIndex = 0;
let answered = false;
let sessionCorrect = 0;
let sessionWrong = [];
let currentMode = "normal";
let currentLabel = "";

const $ = id => document.getElementById(id);
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function updateSavedStats(){
  $("savedCorrect").textContent = state.correct || 0;
  $("savedSessions").textContent = state.sessions || 0;
}
function selectedLessonValue(){ return $("lessonSelect").value; }

function buildBaseSet(){
  const val = selectedLessonValue();
  const set = val === "all" ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => String(q.lesson) === val);
  $("targetCount").textContent = set.length + "問";
  return set;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function startSession(mode){
  baseSet = buildBaseSet();
  if (!baseSet.length) return;
  currentMode = mode;
  if (mode === "random") {
    currentSet = shuffle(baseSet).slice(0, Math.min(10, baseSet.length));
    currentLabel = "ランダム10問";
  } else {
    currentSet = [...baseSet];
    currentLabel = "通常問題";
  }
  currentIndex = 0;
  answered = false;
  sessionCorrect = 0;
  sessionWrong = [];
  $("resultCard").classList.remove("show");
  $("quizCard").classList.remove("hidden");
  renderQuestion();
}
function startRetryWrong(){
  if (!sessionWrong.length) return;
  currentSet = [...sessionWrong];
  currentIndex = 0;
  answered = false;
  sessionCorrect = 0;
  sessionWrong = [];
  currentMode = "retry";
  currentLabel = "間違いだけ再テスト";
  $("resultCard").classList.remove("show");
  $("quizCard").classList.remove("hidden");
  renderQuestion();
}
function renderQuestion(){
  const item = currentSet[currentIndex];
  $("lessonBadge").textContent = currentLabel;
  $("qhead").textContent = `第${item.lesson}回 ${item.lessonTitle} / 問${item.no}`;
  $("countText").textContent = `${currentIndex+1} / ${currentSet.length}`;
  $("question").textContent = item.q;
  $("progressBar").style.width = ((currentIndex) / currentSet.length * 100) + "%";

  const choices = $("choices");
  choices.innerHTML = "";
  item.c.forEach((choice, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice";
    btn.innerHTML = `<strong>${idx+1}.</strong> ${choice}`;
    btn.addEventListener("click", () => answer(idx));
    choices.appendChild(btn);
  });

  answered = false;
  $("feedback").className = "feedback";
  $("fbTitle").textContent = "";
  $("fbBody").textContent = "";
  updateNavButtons();
}
function answer(idx){
  if(answered) return;
  answered = true;
  const item = currentSet[currentIndex];
  const buttons = [...$("choices").querySelectorAll(".choice")];
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === item.a) b.classList.add("correct");
    if (i === idx && i !== item.a) b.classList.add("wrong");
  });

  const correct = idx === item.a;
  $("feedback").classList.add("show");
  if (correct) {
    sessionCorrect += 1;
    state.correct = (state.correct || 0) + 1;
    $("fbTitle").textContent = "○ 正解！";
    $("feedback").classList.add("ok");
  } else {
    sessionWrong.push(item);
    $("fbTitle").textContent = "× ちがいます";
    $("feedback").classList.add("ng");
  }
  $("fbBody").textContent = `正解：${item.a+1}. ${item.c[item.a]}\n解説：${item.e}`;
  updateSavedStats();
  saveState();
  updateNavButtons();
}
function nextQuestion(){
  if (!currentSet.length || !answered) return;
  if (currentIndex < currentSet.length - 1) {
    currentIndex += 1;
    renderQuestion();
  } else {
    finishSession();
  }
}
function prevQuestion(){
  if (!currentSet.length || currentIndex === 0) return;
  currentIndex -= 1;
  renderQuestion();
}
function finishSession(){
  state.sessions = (state.sessions || 0) + 1;
  state.history = state.history || [];
  state.history.push({
    date: new Date().toISOString(),
    mode: currentMode,
    total: currentSet.length,
    correct: sessionCorrect,
    wrong: currentSet.length - sessionCorrect
  });
  saveState();

  $("quizCard").classList.add("hidden");
  $("resultCard").classList.add("show");
  $("resultScore").textContent = `${sessionCorrect} / ${currentSet.length} 問 正解`;
  const rate = Math.round(sessionCorrect / currentSet.length * 100);
  $("resultMessage").innerHTML = `正答率は <strong>${rate}%</strong> です。` +
    (sessionWrong.length ? ` 間違いは <strong>${sessionWrong.length}問</strong>。下のボタンでその問題だけ解き直せます。` : ` 全問正解です。すばらしいです。`);
  $("wrongArea").innerHTML = sessionWrong.length
    ? "<strong>間違えた問題：</strong><ul class='list'>" + sessionWrong.map(q => `<li>第${q.lesson}回 ${q.lessonTitle} / 問${q.no}</li>`).join("") + "</ul>"
    : "";
  $("retryWrong").disabled = sessionWrong.length === 0;
  $("retryWrong").style.opacity = sessionWrong.length === 0 ? "0.45" : "1";
  $("progressBar").style.width = "100%";
  updateSavedStats();
}
function updateNavButtons(){
  $("prevBtn").disabled = currentIndex === 0 || $("quizCard").classList.contains("hidden");
  $("nextBtn").disabled = !answered || $("quizCard").classList.contains("hidden");
  $("nextBtn").textContent = (currentIndex === currentSet.length - 1) ? "結果へ" : "次へ";
}
$("startNormal").addEventListener("click", () => startSession("normal"));
$("startRandom").addEventListener("click", () => startSession("random"));
$("retryWrong").addEventListener("click", startRetryWrong);
$("restartSame").addEventListener("click", () => startSession(currentMode === "random" ? "random" : "normal"));
$("prevBtn").addEventListener("click", prevQuestion);
$("nextBtn").addEventListener("click", nextQuestion);
$("shuffleBtn").addEventListener("click", () => startSession("random"));
$("lessonSelect").addEventListener("change", () => { buildBaseSet(); });
updateSavedStats();
buildBaseSet();
updateNavButtons();
</script>
